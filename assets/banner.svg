<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .pulse-orb {
        animation: pulseOrb 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: dashAnimation 18s linear infinite;
      }
      .float-card-1 {
        animation: floatOne 5s ease-in-out infinite alternate;
      }
      .float-card-2 {
        animation: floatTwo 6s ease-in-out infinite alternate;
      }
      .float-card-3 {
        animation: floatThree 5.5s ease-in-out infinite alternate;
      }
      @keyframes dashAnimation {
        to { stroke-dashoffset: -140; }
      }
      @keyframes pulseOrb {
        0% { opacity: 0.35; transform: scale(0.95); }
        100% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatOne {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px); }
        100% { transform: translateY(7px); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Deep Backdrop Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#gridPattern)" />

  <!-- Animated Ambient Light Orbs (Background depth) -->
  <g class="pulse-orb" transform="translate(180, 80)">
    <circle cx="0" cy="0" r="160" fill="#6366f1" opacity="0.25" filter="url(#glowFilter)" />
  </g>
  <g class="pulse-orb" transform="translate(1040, 320)">
    <circle cx="0" cy="0" r="180" fill="#ec4899" opacity="0.2" filter="url(#glowFilter)" />
  </g>
  <g class="pulse-orb" transform="translate(600, 390)">
    <circle cx="0" cy="0" r="130" fill="#06b6d4" opacity="0.2" filter="url(#glowFilter)" />
  </g>

  <!-- Flowing Dynamic Telemetry Streams (Behind content) -->
  <path d="M 50,330 C 250,370 420,290 620,340 C 820,390 1000,310 1150,340" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.5" class="dash-flow" />
  <path d="M 50,360 C 280,310 460,380 660,330 C 860,280 1020,380 1150,330" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" class="dash-flow" />

  <!-- Dynamic Metrics Badges & Micro-cards (Visual Accents) -->
  <g class="float-card-1" transform="translate(90, 48)">
    <rect width="210" height="52" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" filter="url(#lightGlow)" />
    <circle cx="24" cy="26" r="6" fill="#10b981" />
    <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">REAL-TIME INFERENCE</text>
    <text x="38" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">$0.00042 / 1K Tokens</text>
  </g>

  <g class="float-card-2" transform="translate(890, 48)">
    <rect width="220" height="52" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" filter="url(#lightGlow)" />
    <circle cx="24" cy="26" r="6" fill="#06b6d4" />
    <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">ROUTING LATENCY</text>
    <text x="38" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">p99: 14ms • 99.98% SLA</text>
  </g>

  <!-- Foreground Title and Hero Subtitle (Unobscured & Crystal Clear) -->
  <g id="hero-content">
    <!-- Top Super-Badge Pill -->
    <g transform="translate(435, 115)">
      <rect width="330" height="32" rx="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.7" />
      <circle cx="20" cy="16" r="4.5" fill="#38bdf8" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1">GENAI FINOPS &amp; OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      LLM Cost Tracking &amp; Token Observability
    </text>

    <!-- Gradient Accent Sub-line -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="url(#primaryGlow)" letter-spacing="0.5">
      The Curated Stack for AI Gateways, Spend Intelligence &amp; Tracing
    </text>

    <!-- Explanatory Subtitle -->
    <text x="600" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8">
      Production-grade SaaS platforms, Open-Source engines, intelligent model routers, and OpenTelemetry instrumentation
    </text>
  </g>

  <!-- Interactive / Modern Feature Tags Row -->
  <g transform="translate(180, 318)">
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ Smart Model Routing</text>
    </g>
    <g transform="translate(195, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">📊 Granular FinOps</text>
    </g>
    <g transform="translate(380, 0)">
      <rect width="190" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="95" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔍 OpenTelemetry Tracing</text>
    </g>
    <g transform="translate(585, 0)">
      <rect width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="85" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🛡️ Budget Gateways</text>
    </g>
    <g transform="translate(770, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">💾 Semantic Caching</text>
    </g>
  </g>
</svg>
